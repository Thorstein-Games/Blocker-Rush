name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The archive has one pre-rendered page per day (app/daily/[date]), built
  # up to a week ahead, so rebuild daily to keep adding days.
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer one doesn't cancel a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Writes the static site to apps/web/out (output: "export").
      - run: npm run build
        env:
          # Optional repository variables (Settings → Secrets and variables →
          # Actions → Variables), read at build time. Unset means the
          # defaults: wss://megingjord.onrender.com, analytics off.
          NEXT_PUBLIC_GAME_SERVER_URL: ${{ vars.NEXT_PUBLIC_GAME_SERVER_URL }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
          NEXT_PUBLIC_PLAUSIBLE_SCRIPT_SRC: ${{ vars.NEXT_PUBLIC_PLAUSIBLE_SCRIPT_SRC }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
