<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Blocker Rush Logo</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16242a" />
      <stop offset="100%" stop-color="#081117" />
    </linearGradient>

    <linearGradient id="tileGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2b4f" />
      <stop offset="100%" stop-color="#0d1936" />
    </linearGradient>

    <linearGradient id="blockerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20332f" />
      <stop offset="100%" stop-color="#111b18" />
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe07a" />
      <stop offset="100%" stop-color="#c99a1e" />
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" />
  <rect x="10" y="10" width="236" height="236" rx="48" fill="none" stroke="#cde8d6" stroke-opacity="0.14" stroke-width="2" />

  <!-- Subtle grid -->
  <g stroke="#d2ffe1" opacity="0.08" stroke-width="1">
    <path d="M0 52H256" />
    <path d="M0 104H256" />
    <path d="M0 156H256" />
    <path d="M0 208H256" />
    <path d="M52 0V256" />
    <path d="M104 0V256" />
    <path d="M156 0V256" />
    <path d="M208 0V256" />
  </g>

  <!-- Main board tiles -->
  <g transform="translate(40 40)">
    <rect x="0" y="0" width="52" height="52" rx="12" fill="url(#tileGrad)" />
    <rect x="62" y="0" width="52" height="52" rx="12" fill="url(#tileGrad)" />
    <rect x="124" y="0" width="52" height="52" rx="12" fill="#b07cff" filter="url(#softGlow)" />

    <rect x="0" y="62" width="52" height="52" rx="12" fill="url(#tileGrad)" />

    <rect x="62" y="62" width="52" height="52" rx="12" fill="url(#blockerGrad)" stroke="#f2c54f" stroke-opacity="0.8" />
    <path d="M74 74L102 102M102 74L74 102" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" filter="url(#softGlow)" />

    <rect x="124" y="62" width="52" height="52" rx="12" fill="#b07cff" filter="url(#softGlow)" />

    <rect x="0" y="124" width="52" height="52" rx="12" fill="#40b7ff" filter="url(#softGlow)" />
    <rect x="62" y="124" width="52" height="52" rx="12" fill="#40b7ff" filter="url(#softGlow)" />
    <rect x="124" y="124" width="52" height="52" rx="12" fill="#ffaa3c" filter="url(#softGlow)" />
  </g>
</svg>
